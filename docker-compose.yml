services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - data:/app/data
      - ./test-data:/app/test-data:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
      - TEST_DATA_DIR=/app/test-data
      - STATIC_DIR=/app/frontend/dist
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  data:
    name: test_center_data
